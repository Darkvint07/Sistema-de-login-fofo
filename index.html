<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login dos Gatos!</title>
    <style>
        body {
            background: linear-gradient(120deg, #ffcbf2 0%, #bde0fe 100%);
            color: #2a2550;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .box {
            background: #fff;
            border-radius: 18px;
            border: 3px solid #ff79c6;
            padding: 28px 38px 22px 38px;
            box-shadow: 0 4px 20px #abbcff7a;
            min-width: 320px;
            margin-top: 26px;
            color: #2a1850;
            text-align: center;
        }

        h1,
        h2 {
            color: #ff79c6;
        }

        label {
            display: block;
            margin-top: 14px;
        }

        input {
            width: 94%;
            margin: 7px 0 0 0;
            border-radius: 7px;
            padding: 8px;
        }

        button {
            margin-top: 22px;
            padding: 13px 24px;
            border-radius: 25px;
            background: linear-gradient(90deg, #bde0fe, #ff79c6, #fff);
            border: none;
            color: #212279;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 1px 8px #ffd6fa72;
            transition: background 0.18s;
        }

        button:hover {
            background: linear-gradient(90deg, #ff79c6, #bde0fe, #fff);
        }

        #boxGato img {
            margin-top: 20px;
            max-width: 390px;
            border-radius: 18px;
            border: 4px solid #b4f0ff;
            box-shadow: 0 8px 30px #79a6ea77;
            animation: aparece 0.4s;
            background: #fff;
        }

        @keyframes aparece {
            from {
                opacity: 0;
                transform: scale(0.93);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        p,
        a {
            color: #3255d3;
        }

        a {
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box" id="areaLogin">
        <h1>Login</h1>
        <label>Usuário: <input type="text" id="usuario"></label>
        <label>Senha: <input type="password" id="senha"></label>
        <button onclick="fazerLogin()">Entrar</button>
        <p>Não tem conta? <a onclick="mostrarCadastro()">Cadastre-se</a></p>
    </div>
    <div class="box" id="areaCadastro" style="display:none;">
        <h1>Cadastro</h1>
        <label>Novo usuário: <input type="text" id="novoUsuario"></label>
        <label>Nova senha: <input type="password" id="novaSenha"></label>
        <button onclick="fazerCadastro()">Cadastrar</button>
        <p><a onclick="mostrarLogin()">Já tem conta? Fazer login</a></p>
    </div>

    <!-- Área que aparece após login -->
    <div style="display:none;" id="areaGato">
        <div class="box" id="boxGato">
            <h2>Clique para ver um gato engraçado!</h2>
            <button onclick="mostrarGato()">Clique para ver um gato 🐱</button>
            <img src="" alt="Gato engraçado" id="gatoImg" style="display:none;">
        </div>
    </div>

    <script>
        // Recupera usuários do localStorage ou inicializa com admin padrão
        var usuarios = [];
        if (localStorage.getItem('usuarios')) {
            usuarios = JSON.parse(localStorage.getItem('usuarios'));
        } else {
            usuarios = [{ usuario: 'admin', senha: '1234' }];
        }

        function fazerLogin() {
            var usuario = document.getElementById('usuario').value;
            var senha = document.getElementById('senha').value;
            var achou = usuarios.find(u => u.usuario === usuario && u.senha === senha);
            if (achou) {
                document.getElementById('areaLogin').style.display = 'none';
                document.getElementById('areaCadastro').style.display = 'none';
                document.getElementById('areaGato').style.display = 'block';
                mostrarGato();
            } else {
                alert('Usuário ou senha inválidos!');
            }
        }
        function mostrarCadastro() {
            document.getElementById('areaLogin').style.display = 'none';
            document.getElementById('areaCadastro').style.display = 'block';
        }
        function mostrarLogin() {
            document.getElementById('areaCadastro').style.display = 'none';
            document.getElementById('areaLogin').style.display = 'block';
        }
        function fazerCadastro() {
            var novoUsuario = document.getElementById('novoUsuario').value;
            var novaSenha = document.getElementById('novaSenha').value;
            if (usuarios.find(u => u.usuario === novoUsuario)) {
                alert('Usuário já existe!');
                return;
            }
            usuarios.push({ usuario: novoUsuario, senha: novaSenha });
            localStorage.setItem('usuarios', JSON.stringify(usuarios)); // Salva usuários no navegador
            alert('Cadastrado com sucesso!');
            mostrarLogin();
        }

        function mostrarGato() {
            var img = document.getElementById('gatoImg');
            img.style.display = 'none';
            fetch("https://api.thecatapi.com/v1/images/search?size=full&mime_types=jpg,png")
                .then(r => r.json())
                .then(dados => {
                    img.src = dados[0].url;
                    img.onload = () => img.style.display = 'block';
                });
        }
    </script>
</body>

</html>
